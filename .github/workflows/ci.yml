# CI: test every push and PR; deploy main to Cloudflare Pages once the suite is green.
#
# Built for WALL TIME. The old shape ran everything in sequence — one test job for
# both browser projects, then a deploy job that checked out and REBUILT the site
# before a wrangler upload that sometimes sat for ten minutes. Typical push-to-live
# was 12–20 minutes, worst cases 25 with a manual re-run. Now:
#
#   · the two Playwright projects run as PARALLEL jobs, three shards each, so the test
#     wall time is a third of one project's;
#   · dist/ is built ONCE, in its own job running alongside the tests, and handed
#     to deploy as an artifact — the deploy job never installs npm or rebuilds, and
#     what ships is byte-for-byte what was assembled while the tests ran;
#   · the wrangler upload is BOUNDED: two attempts of five minutes each, wrangler
#     pinned, instead of one open-ended call that hangs against the job timeout
#     (observed repeatedly on Cloudflare's side — the retry has cleared it every
#     time);
#   · a newer push CANCELS an in-flight run for the same ref: the old commit's
#     tests and upload were about to be superseded anyway.
#
# Typical push-to-live target: ~5–6 minutes. Worst case (both upload attempts time
# out) fails loudly in ~12 rather than hanging silently.
#
# Deploy gating history: Cloudflare Pages' Git integration used to auto-deploy
# main; it is disabled now, and this workflow's deploy job — armed by the two
# repo secrets below — is the only deployer. Without the secrets the deploy job
# skips itself and says so.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, so a deploy can be retried without an empty commit — needed the day
  # Cloudflare's Git integration stopped building and there was nothing to push.
  workflow_dispatch:

# One live run per ref: a new push supersedes the previous run entirely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The stale-build check lives here, next to the artifact it protects: editing
      # app.src.html and forgetting `npm run build:html` must fail the run, or a green
      # suite ships stale code.
      - name: index.html and the wallet function are up to date with their sources
        run: |
          npm run build:html
          npm run build:wallet
          git diff --exit-code -- index.html service-worker.js staff.js functions/api/wallet-pass.js \
            || { echo '::error::index.html/service-worker.js/staff.js/functions/api/wallet-pass.js are stale — run `npm run build:html && npm run build:wallet` and commit the result.'; exit 1; }
      - name: Assemble dist/ (every referenced asset must be present)
        run: node scripts/assemble-dist.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint once, not once per shard — it is project-independent.
      - if: matrix.project == 'chromium' && matrix.shard == 1
        name: Lint (eslint + tsc + i18n key parity)
        run: npm run lint
      # Browser binaries cached across runs; the install is a no-op download on a hit
      # and only the small apt step remains.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Each project runs as three shards, so the suite's wall time is a third of one project's
      # (about 9.5 minutes on two workers before, 2026-09-27); playwright.config.ts sets the workers.
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3

  deploy:
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - id: secrets
        name: Check for Cloudflare credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        name: Skip (no Cloudflare token — nothing deploys)
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping gated deploy."
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.secrets.outputs.present == 'true'
        name: Deploy to Cloudflare Pages (bounded, two attempts)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Run from INSIDE dist/. Wrangler looks for the Functions directory beside the
          # working directory, not inside the directory it is given, and this job never
          # checks the repo out - it only downloads dist/. Deploying from the repo root
          # therefore found no functions/ and shipped the site with every Pages Function
          # missing: no Apple Wallet pass, no booking mail, no push, no error log, and no
          # middleware. It said nothing about it either; the giveaway is the absence of
          # "Compiled Worker successfully" in the output below.
          cd dist
          for attempt in 1 2; do
            echo "wrangler upload attempt $attempt"
            if timeout 300 npx --yes wrangler@4.128.0 pages deploy . \
                 --project-name=micromobilityrentals --branch=main; then
              exit 0
            fi
            echo "::warning::attempt $attempt failed or timed out after 5 minutes"
          done
          echo "::error::both upload attempts failed — Cloudflare side; re-run this job"
          exit 1
      - if: steps.secrets.outputs.present == 'true'
        name: The deployed site answers on a Pages Function
        run: |
          # A deploy that quietly drops the Functions is the failure this guards against:
          # the site looks perfect and every /api route is gone. A POST that reaches a
          # function gets its answer; one that reaches the static file server gets 405.
          # The old test was "anything but 405 passes", so a timeout, a DNS failure or a
          # Cloudflare 5xx returned 000/502 and the step went green having verified nothing.
          # Then it became "only a 2xx passes" - but log-error only answers this probe 2xx while
          # Discord is NOT set up; once DISCORD_WEBHOOK is set it refuses a message-less POST
          # from outside the site (403/400), and every deploy would have gone red. So the proof
          # is the answer itself: our functions always reply with JSON carrying an "ok" field,
          # which neither the static server's 405 nor the middleware's plain-text 404 does.
          probe="$RUNNER_TEMP/probe.json"
          for attempt in 1 2 3; do
            code=$(curl -s -o "$probe" -w '%{http_code}' --max-time 20 -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              https://micromobilityrentals.pages.dev/api/log-error) || true
            body=$(head -c 200 "$probe" 2>/dev/null || true)
            echo "attempt $attempt: /api/log-error -> $code $body"
            if printf '%s' "$body" | grep -q '"ok":'; then echo "Pages Functions are live."; exit 0; fi
            case "$code" in
              405) echo "405 = the static file server answered; Functions are not live yet." ;;
              000) echo "no answer (timeout / DNS / TLS)." ;;
              *)   echo "no function answer in the body." ;;
            esac
            [ "$attempt" = 3 ] || sleep 20
          done
          echo "::error::no Pages Function answered after 3 attempts (last status: $code)"
          exit 1
